name: test-project
runtime: yaml
description: Testing function invocation during preview

variables:
  runResult:
    fn::invoke:
      function: command:local:run
      arguments:
        command: |
          echo "========================================="
          echo "FUNCTION EXECUTED DURING PREVIEW!"
          echo "SECRET_TOKEN=$SECRET_TOKEN"
          echo "========================================="

outputs:
  result: ${runResult.stdout}
